name: Deploy back-office

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CONTAINER: carbugui-backoffice
  HOST_PORT: "3000"

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart the container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          CONTAINER: ${{ env.CONTAINER }}
          HOST_PORT: ${{ env.HOST_PORT }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARBUGUI_API_URL: ${{ secrets.CARBUGUI_API_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          STATION_VAULT_KEY: ${{ secrets.STATION_VAULT_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,CONTAINER,HOST_PORT,REGISTRY_USER,REGISTRY_TOKEN,CARBUGUI_API_URL,GOOGLE_MAPS_API_KEY,STATION_VAULT_KEY
          script_stop: true
          script: |
            set -eu
            APP_DIR="$HOME/carbugui-backoffice"
            mkdir -p "$APP_DIR"
            umask 077

            # Runtime env, rewritten on every deploy from the repository secrets.
            {
              printf 'CARBUGUI_API_URL=%s\n' "$CARBUGUI_API_URL"
              printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY"
              printf 'STATION_VAULT_KEY=%s\n' "$STATION_VAULT_KEY"
            } > "$APP_DIR/.env"

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io

            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "$HOST_PORT:3000" \
              --env-file "$APP_DIR/.env" \
              -v carbugui-backoffice-data:/app/.data \
              "$IMAGE"

            # Fail the job if the console does not answer within a minute.
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$HOST_PORT/login" || true)
              if [ "$code" = "200" ]; then
                echo "Back-office is up (HTTP 200)."
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "Back-office did not answer on port $HOST_PORT:"
            docker logs --tail 80 "$CONTAINER"
            exit 1
